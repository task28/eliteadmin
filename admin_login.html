<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        body { background: #0f0f0f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; color: #fff; }
        .login-box { background: #1a1a1a; padding: 40px; border-radius: 15px; border: 1px solid #D4AF37; width: 300px; text-align: center; box-shadow: 0 0 20px rgba(212, 175, 55, 0.2); }
        h2 { color: #D4AF37; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin: 10px 0; background: #222; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #D4AF37; border: none; font-weight: bold; cursor: pointer; margin-top: 20px; border-radius: 5px; }
        button:hover { background: #b89628; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>ADMIN ACCESS</h2>
        <input type="text" id="phone" placeholder="Phone Number">
        <input type="password" id="pass" placeholder="Password">
        <button onclick="login()">SECURE LOGIN</button>
    </div>

    <script>
        function login() {
            const p = document.getElementById('phone').value;
            const pass = document.getElementById('pass').value;
            if(p === "01310504728" && pass === "RAFSAN20") {
                localStorage.setItem('admin_auth', 'true');
                window.location.href = "admin_home.html";
            } else {
                alert("Access Denied! Wrong Credentials.");
            }
        }
    </script>
</body>
</html>
