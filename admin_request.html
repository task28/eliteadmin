<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Request - Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --dark: #0f0f0f; --card: #1e1e1e; --green: #28a745; --red: #dc3545; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: var(--dark); color: #fff; padding: 20px; }
        
        .top-stats { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-badge { background: #222; padding: 10px 20px; border-radius: 5px; border: 1px solid #444; flex: 1; text-align: center; }
        .stat-badge span { display: block; font-size: 1.2rem; font-weight: bold; }
        
        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        
        /* Left: Incoming Requests & Proofs */
        .section { background: var(--card); padding: 15px; border-radius: 10px; border: 1px solid #333; height: 80vh; overflow-y: auto; }
        .req-card { background: #000; padding: 10px; margin-bottom: 10px; border-left: 3px solid var(--gold); cursor: pointer; }
        .req-card:hover { background: #333; }
        .req-card.active { border-color: var(--green); background: #222; }
        
        /* Right: Assign Task Form */
        .form-box { background: #151515; padding: 20px; border-radius: 10px; border: 1px solid var(--gold); }
        .raw-input { width: 100%; height: 100px; background: #222; color: #fff; border: 1px dashed #555; padding: 10px; margin-bottom: 10px; }
        .auto-btn { background: var(--gold); color: #000; border: none; padding: 8px 15px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; }
        
        input { width: 100%; padding: 10px; margin-bottom: 10px; background: #333; border: 1px solid #555; color: #fff; box-sizing: border-box; }
        .send-btn { background: var(--green); color: #fff; width: 100%; padding: 12px; border: none; font-weight: bold; cursor: pointer; }

        /* Action Buttons for Proof */
        .action-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-approve { background: var(--green); flex: 1; padding: 8px; border: none; color: #fff; cursor: pointer; }
        .btn-reject { background: var(--red); flex: 1; padding: 8px; border: none; color: #fff; cursor: pointer; }

    </style>
</head>
<body>

    <h2 style="color:var(--gold); border-bottom:1px solid #333; padding-bottom:10px;">TASK MANAGEMENT</h2>

    <div class="top-stats">
        <div class="stat-badge" style="color:var(--gold)">Given: <span id="cntGiven">0</span></div>
        <div class="stat-badge" style="color:#ffa500">Pending: <span id="cntPending">0</span></div>
        <div class="stat-badge" style="color:var(--green)">Successful: <span id="cntSuccess">0</span></div>
        <div class="stat-badge" style="color:var(--red)">Rejected: <span id="cntReject">0</span></div>
    </div>

    <div class="container">
        
        <!-- LEFT: Requests List -->
        <div class="section">
            <h3 style="color:#aaa">INCOMING REQUESTS</h3>
            <div id="requestList">
                <!-- User Requests will load here -->
                <div style="color:#555; text-align:center;">Waiting for requests...</div>
            </div>

            <h3 style="color:#aaa; margin-top:30px;">SUBMITTED PROOFS</h3>
            <div id="proofList">
                <!-- Proofs will load here -->
            </div>
        </div>

        <!-- RIGHT: Assign Form -->
        <div class="section">
            <div class="form-box">
                <h3 style="margin-top:0">ASSIGN NEW TASK</h3>
                <div style="font-size: 0.8rem; color: #aaa; margin-bottom: 5px;">Selected User: <span id="selectedUser" style="color:var(--gold)">None</span></div>
                
                <textarea id="rawData" class="raw-input" placeholder="Paste data here...&#10;First name: Kevin&#10;Last name: Hernandez&#10;..."></textarea>
                <button class="auto-btn" onclick="autoFill()">AUTO FILL DATA</button>

                <input type="text" id="fname" placeholder="First Name">
                <input type="text" id="lname" placeholder="Last Name">
                <input type="text" id="pass" placeholder="Password">
                <input type="text" id="dob" placeholder="Birthdate">
                <input type="text" id="email" placeholder="Email">
                <input type="text" id="recEmail" placeholder="Recovery Email">

                <button class="send-btn" onclick="sendTask()">SEND TASK TO USER</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCMLtk6Nm4oK1Rt6InUQ4EeWFC3mTBeaA",
            authDomain: "task-elite.firebaseapp.com",
            databaseURL: "https://task-elite-default-rtdb.firebaseio.com",
            projectId: "task-elite",
            storageBucket: "task-elite.firebasestorage.app",
            messagingSenderId: "352060113315",
            appId: "1:352060113315:web:c44977d17cf7bab791da16"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let selectedUid = null;
        let adminStats = { given: 0, success: 0, reject: 0 };

        // Load Stats
        onValue(ref(db, 'admin/stats'), (snap) => {
            const data = snap.val();
            if(data) {
                adminStats = data;
                document.getElementById('cntGiven').innerText = data.given || 0;
                document.getElementById('cntSuccess').innerText = data.success || 0;
                document.getElementById('cntReject').innerText = data.reject || 0;
            }
        });

        // Load Requests & Proofs
        onValue(ref(db, 'users'), (snapshot) => {
            const users = snapshot.val();
            const reqList = document.getElementById('requestList');
            const proofList = document.getElementById('proofList');
            
            reqList.innerHTML = '';
            proofList.innerHTML = '';
            let pendingCount = 0;

            if (users) {
                Object.entries(users).forEach(([uid, user]) => {
                    // 1. New Requests (Searching)
                    if (user.current_task && user.current_task.status === 'searching') {
                        const div = document.createElement('div');
                        div.className = 'req-card';
                        div.innerHTML = `<b>${user.firstName}</b> (${user.phone})<br><small>Waiting for task...</small>`;
                        div.onclick = () => selectUser(uid, user.firstName, div);
                        reqList.appendChild(div);
                    }

                    // 2. Submitted Proofs
                    if (user.current_task && user.current_task.status === 'submitted') {
                        pendingCount++;
                        const proof = user.current_task.submission;
                        const div = document.createElement('div');
                        div.className = 'req-card';
                        div.style.borderLeftColor = '#fff';
                        div.innerHTML = `
                            <b>${user.firstName}</b> submitted:<br>
                            <span style="color:#aaa">Email:</span> ${proof.email}<br>
                            <span style="color:#aaa">Pass:</span> ${proof.password}<br>
                            <div class="action-btns">
                                <button class="btn-approve" onclick="approveTask('${uid}', ${user.balance}, ${user.taskCount})">Approve (Pay)</button>
                                <button class="btn-reject" onclick="rejectTask('${uid}')">Reject (Fake)</button>
                            </div>
                        `;
                        proofList.appendChild(div);
                    }
                });
                document.getElementById('cntPending').innerText = pendingCount;
            }
        });

        // Select User to Assign
        window.selectUser = (uid, name, element) => {
            selectedUid = uid;
            document.getElementById('selectedUser').innerText = name;
            document.querySelectorAll('.req-card').forEach(el => el.classList.remove('active'));
            element.classList.add('active');
        };

        // Auto Fill Logic
        window.autoFill = () => {
            const raw = document.getElementById('rawData').value;
            
            const getVal = (regex) => raw.match(regex)?.[1]?.trim() || '';

            document.getElementById('fname').value = getVal(/First name:(.*)/i);
            document.getElementById('lname').value = getVal(/Last name:(.*)/i);
            document.getElementById('pass').value = getVal(/Password:(.*)/i);
            document.getElementById('dob').value = getVal(/Birthdate:(.*)/i);
            document.getElementById('email').value = getVal(/Email:(.*)/i);
            document.getElementById('recEmail').value = getVal(/Recovery email:(.*)/i);
        };

        // Send Task
        window.sendTask = () => {
            if (!selectedUid) return alert("Select a user first!");
            
            const taskData = {
                firstName: document.getElementById('fname').value,
                lastName: document.getElementById('lname').value,
                password: document.getElementById('pass').value,
                birthdate: document.getElementById('dob').value,
                email: document.getElementById('email').value,
                recoveryEmail: document.getElementById('recEmail').value
            };

            update(ref(db, `users/${selectedUid}/current_task`), {
                status: 'active',
                data: taskData,
                expiresAt: Date.now() + (13 * 60 * 1000)
            });

            // Update Admin Stats
            update(ref(db, 'admin/stats'), { given: (adminStats.given || 0) + 1 });
            
            alert("Task Sent Successfully!");
            // Clear inputs
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.getElementById('rawData').value = '';
            selectedUid = null;
            document.getElementById('selectedUser').innerText = "None";
        };

        // Approve Task
        window.approveTask = (uid, currentBal, currentTaskCount) => {
            if(confirm("Approve this task and pay user?")) {
                const payAmount = 10; // Example: 10 Taka per task
                update(ref(db, `users/${uid}`), {
                    balance: (currentBal || 0) + payAmount,
                    lifetimeBalance: ((currentBal || 0) + payAmount), // Logic needs adjustment if balance spent
                    taskCount: (currentTaskCount || 0) + 1
                });
                
                // Reset User Status
                update(ref(db, `users/${uid}/current_task`), { status: 'idle', data: null, submission: null });
                
                // Update Admin Stats
                update(ref(db, 'admin/stats'), { success: (adminStats.success || 0) + 1 });
                
                // Update User Stats
                // Note: Need to fetch user stats first ideally, simplified here
                update(ref(db, `users/${uid}/task_stats`), { 
                   success: firebase.database.ServerValue.increment(1) 
                });
            }
        };

        // Reject Task
        window.rejectTask = (uid) => {
            if(confirm("Reject this task as FAKE?")) {
                // Reset User Status
                update(ref(db, `users/${uid}/current_task`), { status: 'idle', data: null, submission: null });
                
                // Update Admin Stats
                update(ref(db, 'admin/stats'), { reject: (adminStats.reject || 0) + 1 });

                 // Update User Stats
                 update(ref(db, `users/${uid}/task_stats`), { 
                   failed: firebase.database.ServerValue.increment(1) 
                });
            }
        };

        // Expose functions to window for HTML onClick
        window.autoFill = window.autoFill;
        window.sendTask = window.sendTask;
        window.approveTask = window.approveTask;
        window.rejectTask = window.rejectTask;

    </script>
</body>
</html>
