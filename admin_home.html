<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --gold: #D4AF37; --dark: #0f0f0f; --card: #1e1e1e; }
        body { margin: 0; font-family: sans-serif; background: var(--dark); color: #fff; }
        
        /* Sidebar */
        .sidebar { height: 100%; width: 0; position: fixed; z-index: 1; top: 0; left: 0; background-color: #111; overflow-x: hidden; transition: 0.5s; padding-top: 60px; border-right: 1px solid var(--gold); }
        .sidebar a { padding: 10px 15px; text-decoration: none; font-size: 18px; color: #818181; display: block; transition: 0.3s; }
        .sidebar a:hover { color: var(--gold); }
        .closebtn { position: absolute; top: 0; right: 25px; font-size: 36px; margin-left: 50px; }

        /* Main Content */
        #main { transition: margin-left .5s; padding: 20px; }
        .header { display: flex; align-items: center; justify-content: space-between; background: #1a1a1a; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .menu-icon { font-size: 30px; cursor: pointer; color: var(--gold); }

        /* Stats Grid */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 10px; border-left: 4px solid var(--gold); text-align: center; }
        .card h3 { margin: 0; color: #aaa; font-size: 0.9rem; }
        .card p { margin: 10px 0 0; font-size: 1.8rem; font-weight: bold; color: #fff; }
    </style>
</head>
<body>

    <div id="mySidebar" class="sidebar">
        <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">&times;</a>
        <a href="admin_home.html" style="color:var(--gold)">Dashboard</a>
        <a href="admin_request.html">Task Request</a>
        <a href="admin_monthly_weekly_request.html">Weekly/Monthly</a>
        <a href="admin_withdrawal.html">Withdrawals</a>
        <a href="admin_user_details.html">User Details</a>
        <a href="index_2.html" onclick="localStorage.clear()">Logout</a>
    </div>

    <div id="main">
        <div class="header">
            <span class="menu-icon" onclick="openNav()">&#9776;</span>
            <h2 style="margin:0; color:var(--gold)">ADMIN DASHBOARD</h2>
        </div>

        <div class="grid">
            <div class="card"><h3>Total Users</h3><p id="totalUsers">0</p></div>
            <div class="card"><h3>Total Lifetime Earning</h3><p id="totalEarning">৳0</p></div>
            <div class="card"><h3>Pending Tasks</h3><p id="pendingTasks">0</p></div>
            <div class="card"><h3>Withdraw Request</h3><p id="withdrawReq">0</p></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBCMLtk6Nm4oK1Rt6InUQ4EeWFC3mTBeaA",
            authDomain: "task-elite.firebaseapp.com",
            databaseURL: "https://task-elite-default-rtdb.firebaseio.com",
            projectId: "task-elite",
            storageBucket: "task-elite.firebasestorage.app",
            messagingSenderId: "352060113315",
            appId: "1:352060113315:web:c44977d17cf7bab791da16"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch Stats
        onValue(ref(db, 'users'), (snapshot) => {
            const users = snapshot.val();
            if (users) {
                document.getElementById('totalUsers').innerText = Object.keys(users).length;
                let earning = 0;
                let pendingT = 0;
                
                Object.values(users).forEach(u => {
                    earning += (u.lifetimeBalance || 0);
                    if(u.current_task && u.current_task.status === 'searching') pendingT++;
                });
                document.getElementById('totalEarning').innerText = "৳" + earning;
                document.getElementById('pendingTasks').innerText = pendingT;
            }
        });

        // Toggle Sidebar
        window.openNav = () => { document.getElementById("mySidebar").style.width = "250px"; document.getElementById("main").style.marginLeft = "250px"; }
        window.closeNav = () => { document.getElementById("mySidebar").style.width = "0"; document.getElementById("main").style.marginLeft = "0"; }
    </script>
</body>
</html>
